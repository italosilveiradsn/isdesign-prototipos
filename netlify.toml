# Publica só o site (portfólios e protótipos). Listas e e-mails de prospecção não vão para o ar na Netlify.
[build]
  command = "rm -rf agencias wordpress"
  publish = "."

[[redirects]]
  from = "/"
  to = "/parceiros/"
  status = 302

# Proposta OrigoX: fora dos buscadores (página e PDFs)
[[headers]]
  for = "/origox/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Proposta Itabaiana: dados de exemplo, fora dos buscadores
[[headers]]
  for = "/itabaiana/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
